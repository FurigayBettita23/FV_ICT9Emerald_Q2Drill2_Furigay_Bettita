
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Navigation Bar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Helvetica, sans-serif,;
            background-color: #f8f8f3;
        }

        .navbar {
            background-color: #174d35;
        }

        .navbar-brand, .nav-link {
            color: white;
        }

        .nav-link:hover {
            color: #f0d46a;
        }

        .header {
            text-align: center;
            padding: 35px 20px;
            background-color: #e9eee7;
        }

        .header img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .campus-section {
            padding: 35px 20px;
            text-align: center;
        }

        .campus-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        footer {
            background-color: #174d35;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

   
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#home">
                OB Montessori Center
            </a>

            <button class="navbar-toggler bg-light" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarLinks"
                aria-controls="navbarLinks" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarLinks">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#campuses">Campuses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://obmontessorifairview.orangeapps.ph/oa_school/">
                            Portal
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <section class="header" id="home">
        <div class="container">
            <img src="obmc.jpg" alt="OB Montessori Center campus">

            <h1>Welcome to OB Montessori Center</h1>
            <p>A place for learning, growth, and discovery.</p>
        </div>
    </section>
